name: UIUX gallery checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: devkits/uiux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: devkits/uiux
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: devxcrew/ui
          path: shared/ui
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.10.0"
          package-manager-cache: false
      - run: npm install --global npm@12.2.0
      - run: npm ci --ignore-scripts
        working-directory: shared/ui
      - run: npm ci --ignore-scripts
      - run: npm run verify
